name: release

# Publishes the image to the GitHub Container Registry. GITHUB_TOKEN authenticates, thus the
# workflow needs no registry secret and the package follows the visibility of the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sqlite-mcp-sidecar

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # linux/arm64 as well as amd64. One application with one local SQLite file is the shape that
      # runs on a small ARM server, and the Dockerfile cross-compiles from the build platform, thus
      # the second architecture costs no emulation.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Xakpc.SQLiteMCPSidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The product is a security boundary, thus the image says where it was built from.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
